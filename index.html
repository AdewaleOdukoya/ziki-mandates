<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ziki · Decisions</title>
<link rel="icon" href="https://ziki.dev/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&family=Geist+Mono:wght@500;600&display=swap">
<script>document.documentElement.setAttribute("data-theme","light")</script>
<style>
:root{
  --bg:#f5f7fc; --card:#fff; --ink:#111f3d; --muted:#6b7893; --line:#dbe7fd; --line-2:#e8eef9;
  --blue:#3978f6; --blue-strong:#2a63d8; --blue-50:#edf3fe; --sky:#8fc9ff; --ocean:#0b1733; --night:#070f22;
  --ok:#0f8a5f; --ok-bg:#e3f6ee; --ask:#b26a00; --ask-bg:#fff3dc; --no:#b4233f; --no-bg:#fbe6ea; --violet:#7C3AED; --violet-bg:#efe7fe;
  --glow:rgba(57,120,246,.16); --glow-2:rgba(143,201,255,.28); --dot:rgba(17,31,61,.07);
  --shadow:0 1px 2px rgba(17,31,61,.05), 0 10px 30px rgba(17,31,61,.07);
  --head:"Manrope",system-ui,sans-serif; --sans:"Inter",system-ui,sans-serif; --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070f22; --card:#0e1a33; --ink:#e8eef9; --muted:#8193b3; --line:#293f69; --line-2:#1b2a47;
  --blue:#5991ff; --blue-strong:#679bf8; --blue-50:#111f3d;
  --ok:#6ee7a8; --ok-bg:#0f2e26; --ask:#f5b84a; --ask-bg:#33260f; --no:#ff8fa3; --no-bg:#3a1622; --violet:#b69cff; --violet-bg:#261b45;
  --glow:rgba(57,120,246,.22); --glow-2:rgba(143,201,255,.10); --dot:rgba(143,201,255,.06); --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070f22; --card:#0e1a33; --ink:#e8eef9; --muted:#8193b3; --line:#293f69; --line-2:#1b2a47;
  --blue:#5991ff; --blue-strong:#679bf8; --blue-50:#111f3d;
  --ok:#6ee7a8; --ok-bg:#0f2e26; --ask:#f5b84a; --ask-bg:#33260f; --no:#ff8fa3; --no-bg:#3a1622; --violet:#b69cff; --violet-bg:#261b45;
  --glow:rgba(57,120,246,.22); --glow-2:rgba(143,201,255,.10); --dot:rgba(143,201,255,.06); --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{
  margin:0; color:var(--ink); font:15px/1.5 var(--sans); -webkit-font-smoothing:antialiased; overflow-x:clip;
  background:
    radial-gradient(600px 400px at 85% 10%, var(--glow-2), transparent 70%),
    radial-gradient(700px 500px at 0% 60%, var(--glow), transparent 70%),
    radial-gradient(var(--dot) 1px, transparent 1.2px) 0 0/20px 20px,
    var(--bg);
  background-attachment:fixed;
}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--blue); outline-offset:2px; border-radius:8px}
h1,h2,h3{font-family:var(--head); letter-spacing:-.02em; margin:0}

/* header */
.top{background:color-mix(in srgb, var(--card) 85%, transparent); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20}
.top .in{max-width:1080px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; gap:28px}
.brand{display:flex; align-items:center; gap:9px; font:800 18px var(--head); text-decoration:none; color:var(--ink)}
.brand svg{width:30px; height:25px; transition:transform .5s var(--spring)}
.brand:hover svg{transform:rotate(-10deg) scale(1.1)}
.nav{display:flex; gap:4px}
.nav a{padding:7px 12px; border-radius:999px; text-decoration:none; color:var(--muted); font-weight:600; font-size:14px; display:flex; gap:7px; align-items:center; transition:background .2s}
.nav a:hover{background:var(--blue-50)}
.nav a.on{background:var(--blue-50); color:var(--blue-strong)}
.count{background:var(--blue); color:#fff; font:600 11px var(--mono); min-width:19px; height:19px; padding:0 5px; border-radius:999px; display:inline-grid; place-items:center}
.count.bump{animation:bump .5s var(--spring)}
@keyframes bump{40%{transform:scale(1.4)}}
.count[hidden]{display:none}
.right{margin-left:auto; display:flex; gap:10px; align-items:center}
.iconbtn{width:34px; height:34px; border-radius:999px; border:1px solid var(--line); background:var(--card); display:grid; place-items:center; transition:transform .5s var(--spring)}
.iconbtn:hover{transform:rotate(-30deg)}
.iconbtn svg{width:16px; height:16px}
.me{width:34px; height:34px; border-radius:999px; background:linear-gradient(135deg,var(--blue),var(--sky)); color:#fff; display:grid; place-items:center; font:700 13px var(--head)}
@media (max-width:640px){.nav a:not(.on){display:none}}

.wrap{max-width:1080px; margin:0 auto; padding:28px 20px 80px}

/* hero band */
.hero{
  position:relative; overflow:hidden; border-radius:26px; padding:34px 34px; margin-bottom:30px; color:#e8eef9;
  background:radial-gradient(500px 260px at 90% 0%, rgba(143,201,255,.35), transparent 70%), linear-gradient(135deg, #0b1733 0%, #16356f 60%, #2a63d8 130%);
  display:grid; grid-template-columns:1fr auto; align-items:center; gap:20px; box-shadow:var(--shadow);
}
.hero::after{content:""; position:absolute; inset:0; background:radial-gradient(rgba(255,255,255,.08) 1px, transparent 1.2px) 0 0/18px 18px; pointer-events:none}
.hero h1{font-size:34px; font-weight:800; color:#fff}
.hero p{margin:6px 0 0; color:#a9b8d3; max-width:42ch}
.scene{position:relative; width:250px; height:120px; z-index:1}
.scene .bot{position:absolute; bottom:0; animation:float 3.4s ease-in-out infinite}
.scene .b1{left:0} .scene .b2{left:92px; animation-delay:-1.4s}
.scene .bubble{
  position:absolute; top:0; right:6px; background:#fff; color:#0b1733; border-radius:18px 18px 18px 4px; padding:8px 14px;
  font:800 22px var(--head); box-shadow:0 8px 20px rgba(0,0,0,.25); animation:float 3s ease-in-out infinite -.6s; min-width:46px; text-align:center;
}
.scene .bubble.zero{background:var(--sky)}
.scene .spark{position:absolute; color:var(--sky); animation:twinkle 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes twinkle{0%,100%{opacity:.2; transform:scale(.7)} 50%{opacity:1; transform:scale(1.1) rotate(20deg)}}
@media (max-width:640px){.hero{grid-template-columns:1fr; padding:26px 22px} .scene{width:220px}}

/* robots */
.bot svg{display:block}
.eye{transform-box:fill-box; transform-origin:center; animation:blink 4.2s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)} 95%{transform:scaleY(.1)}}
.antenna{transform-box:fill-box; transform-origin:bottom center; animation:wiggle 2.6s ease-in-out infinite}
@keyframes wiggle{50%{transform:rotate(12deg)}}

.grid{display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:24px; align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.label{font:600 12px var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:0 0 12px; display:flex; align-items:center; gap:8px}
.live{width:8px; height:8px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 0 var(--ok); animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}

.card{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:20px; box-shadow:var(--shadow)}
.queue{display:grid; gap:14px}
.ask-card{transition:transform .35s var(--spring), box-shadow .35s; animation:enter .6s var(--spring) both}
.ask-card:nth-child(2){animation-delay:.08s}
.ask-card:hover{transform:translateY(-3px); box-shadow:0 2px 4px rgba(17,31,61,.06), 0 18px 40px rgba(57,120,246,.16)}
@keyframes enter{from{opacity:0; transform:translateY(18px) scale(.97)}}
.ask-card.leaving{animation:leave .45s ease-in forwards}
@keyframes leave{to{opacity:0; transform:translateX(40px) scale(.95)}}
.who{display:flex; align-items:center; gap:10px; font-size:14px; color:var(--muted)}
.who b{color:var(--ink); font-weight:600}
.typing{display:inline-flex; gap:3px; margin-left:-4px}
.typing i{width:4px; height:4px; border-radius:50%; background:var(--muted); animation:type 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
@keyframes type{0%,60%,100%{transform:translateY(0); opacity:.4} 30%{transform:translateY(-3px); opacity:1}}
.timer{margin-left:auto; display:flex; align-items:center; gap:7px; font:600 12px var(--mono); color:var(--ask); background:var(--ask-bg); padding:4px 10px 4px 5px; border-radius:999px; font-variant-numeric:tabular-nums; white-space:nowrap}
.timer svg{width:18px; height:18px; transform:rotate(-90deg)}
.timer circle{fill:none; stroke-width:3}
.timer .tr{stroke:currentColor; opacity:.2} .timer .pr{stroke:currentColor; stroke-linecap:round; stroke-dasharray:44; transition:stroke-dashoffset 1s linear}
.card h3{font-size:19px; font-weight:800; line-height:1.3; margin:14px 0 6px}
.meta{font-size:13.5px; color:var(--muted); margin:0 0 16px; display:flex; align-items:center; gap:8px}
.sev{font:600 11px var(--mono); padding:2px 8px; border-radius:999px}
.sev.high{color:var(--no); background:var(--no-bg)} .sev.low{color:var(--ok); background:var(--ok-bg)}
.opts{display:flex; gap:8px; flex-wrap:wrap}
.btn{border:1px solid var(--line); background:var(--card); border-radius:999px; padding:9px 16px; font-weight:600; font-size:14px; transition:border-color .15s, background .15s, transform .25s var(--spring)}
.btn:hover{border-color:var(--blue); transform:translateY(-2px)}
.btn:active{transform:scale(.96)}
.btn.primary{position:relative; overflow:hidden; background:linear-gradient(135deg,var(--blue),#2a63d8); border-color:transparent; color:#fff; box-shadow:0 6px 16px rgba(57,120,246,.35)}
.btn.primary::after{content:""; position:absolute; top:0; left:-60%; width:40%; height:100%; background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent); transform:skewX(-20deg); animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%} 100%{left:130%}}
.btn.sm{padding:6px 12px; font-size:13px}
.btn.danger{color:var(--no)}
.done{display:flex; align-items:center; gap:10px; padding:14px 20px; font-size:14px; animation:enter .45s var(--spring) both}
.done .undo{margin-left:auto; background:none; border:0; color:var(--blue-strong); font-weight:600}
.tick{width:24px; height:24px; border-radius:999px; display:grid; place-items:center; font-size:12px; font-weight:700; background:var(--ok-bg); color:var(--ok); flex:none; animation:pop .5s var(--spring)}
.tick.n{background:var(--line-2); color:var(--muted)}
@keyframes pop{from{transform:scale(0) rotate(-90deg)}}
.empty{text-align:center; color:var(--muted); padding:32px 20px; animation:enter .6s var(--spring) both}
.empty b{display:block; color:var(--ink); font:800 18px var(--head); margin-top:12px}
.empty svg{width:64px; height:54px; animation:hop 1.6s var(--spring) infinite}
@keyframes hop{0%,50%,100%{transform:translateY(0)} 20%{transform:translateY(-14px) rotate(-8deg)}}

/* rules */
.tabs{display:flex; gap:6px; margin-bottom:16px}
.tab{border:1px solid var(--line); background:none; border-radius:999px; padding:4px 12px 4px 4px; font-weight:600; font-size:13.5px; display:flex; gap:8px; align-items:center; color:var(--muted); transition:all .2s}
.tab.on{background:var(--blue-50); border-color:var(--blue); color:var(--ink)}
.rules{list-style:none; margin:0; padding:0; display:grid; gap:8px}
.rules li{display:grid; grid-template-columns:auto 1fr; gap:10px; align-items:center; font-size:14px; padding:8px 10px; border-radius:12px; transition:background .2s}
.rules li:hover{background:var(--bg)}
.ri{width:26px; height:26px; border-radius:8px; display:grid; place-items:center}
.ri svg{width:14px; height:14px}
.c-allow{background:var(--ok-bg); color:var(--ok)} .c-ask{background:var(--ask-bg); color:var(--ask)} .c-never{background:var(--no-bg); color:var(--no)} .c-you{background:var(--violet-bg); color:var(--violet)}
.rules li.fresh{animation:fresh 1.8s ease-out}
@keyframes fresh{0%{background:var(--ok-bg); transform:scale(1.04)} 100%{background:transparent}}
.revoked .rules li:not(.never){opacity:.4; text-decoration:line-through}
.pfoot{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-top:14px; padding-top:14px; border-top:1px solid var(--line-2); font-size:13px; color:var(--muted)}
.meter{flex:1; min-width:80px; max-width:120px; height:6px; border-radius:99px; background:var(--line-2); overflow:hidden; margin:0 10px}
.meter i{display:block; height:100%; width:72%; border-radius:99px; background:linear-gradient(90deg,var(--blue),var(--sky))}
.revoked .meter i{width:0}

.side{display:grid; gap:24px}
.act{list-style:none; margin:0; padding:0; display:grid; gap:12px}
.act li{display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; font-size:14px}
.act .chip{font:600 10.5px var(--mono); padding:4px 8px; border-radius:999px}
.act li.fresh{animation:slide .6s var(--spring)}
@keyframes slide{from{opacity:0; transform:translateX(-16px)}}

.flyer{position:fixed; z-index:60; pointer-events:none; background:var(--ok-bg); color:var(--ok); border:1px solid var(--ok); border-radius:999px; padding:6px 12px; font:600 12px var(--mono); white-space:nowrap}
.confetti{position:fixed; top:0; left:0; width:8px; height:8px; border-radius:2px; pointer-events:none; z-index:70}
.toast{position:fixed; left:50%; bottom:22px; transform:translate(-50%,200%); background:var(--ocean); color:#e8eef9; padding:11px 16px; border-radius:14px; font-size:14px; transition:transform .4s var(--spring); z-index:50; max-width:calc(100% - 32px); box-shadow:0 12px 30px rgba(7,15,34,.35)}
.toast.show{transform:translate(-50%,0)}
.toast:empty{display:none}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important; transition:none!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="bot" viewBox="0 0 40 44">
      <line class="antenna" x1="20" y1="10" x2="20" y2="3" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="20" cy="3" r="3" fill="#8fc9ff"/>
      <rect x="4" y="10" width="32" height="26" rx="10" fill="currentColor"/>
      <rect x="9" y="16" width="22" height="13" rx="6" fill="#0b1733"/>
      <rect class="eye" x="13" y="19.5" width="4" height="6" rx="2" fill="#8fc9ff"/>
      <rect class="eye" x="23" y="19.5" width="4" height="6" rx="2" fill="#8fc9ff"/>
      <rect x="1" y="19" width="3" height="8" rx="1.5" fill="currentColor"/><rect x="36" y="19" width="3" height="8" rx="1.5" fill="currentColor"/>
      <rect x="13" y="37" width="14" height="5" rx="2.5" fill="currentColor" opacity=".55"/>
    </symbol>
    <symbol id="mark" viewBox="0 0 48 40"><path d="M12.4 2.5H43.1C46.2 2.5 47.8 6.1 45.7 8.4L33.7 21.2C32.4 22.6 30.6 23.3 28.7 23.3H23.1C20.2 23.3 17.9 21 17.9 18.1V16.8H5.3C2.2 16.8.7 13.1 2.8 10.9L8.6 4.7C9.6 3.3 10.9 2.5 12.4 2.5Z" fill="#3978F6"/><path d="M11.1 22.1H32.1C35.1 22.1 36.7 25.8 34.5 28L25.7 37.1C24.8 38 23.5 38.5 22.2 38.5H4.8C1.8 38.5.2 34.9 2.3 32.6L8.1 25C8.9 23.3 9.9 22.1 11.1 22.1Z" fill="#8FC9FF"/></symbol>
    <symbol id="i-allow" viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-ask" viewBox="0 0 16 16"><path d="M5.5 6a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="8" cy="13" r="1.3" fill="currentColor"/></symbol>
    <symbol id="i-never" viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="7" rx="2" fill="currentColor"/><path d="M5 7V5a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  </defs>
</svg>

<header class="top">
  <div class="in">
    <a class="brand" href="https://ziki.dev"><svg aria-hidden="true"><use href="#mark"/></svg>Ziki</a>
    <nav class="nav">
      <a href="#">Issues</a>
      <a href="#" class="on">Decisions <span class="count" id="navcount">2</span></a>
      <a href="#">Agents</a>
    </nav>
    <div class="right">
      <button class="iconbtn" id="theme" aria-label="Toggle dark mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      <span class="me" title="Adewale">AO</span>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="hero">
    <div style="position:relative; z-index:1">
      <h1>Decisions</h1>
      <p>Your agents ask here before doing anything you haven't allowed.</p>
    </div>
    <div class="scene" aria-hidden="true">
      <span class="bot b1" style="color:#3978f6"><svg width="76" height="84"><use href="#bot"/></svg></span>
      <span class="bot b2" style="color:#b69cff"><svg width="62" height="68"><use href="#bot"/></svg></span>
      <span class="bubble" id="bubble">2</span>
      <span class="spark" style="left:72px; top:6px">✦</span>
      <span class="spark" style="left:168px; top:78px; animation-delay:-1.2s">✦</span>
    </div>
  </div>

  <div class="grid">
    <section>
      <p class="label">Waiting on you</p>
      <div class="queue" id="queue"></div>
    </section>

    <aside class="side">
      <div>
        <p class="label">What your agents can do</p>
        <div class="card" id="rules"></div>
      </div>
      <div>
        <p class="label"><span class="live"></span>Recent activity</p>
        <div class="card"><ul class="act" id="act"></ul></div>
      </div>
    </aside>
  </div>
</main>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const now = Date.now();
  const COLOR = {scout:"#3978f6", lens:"#b69cff"};

  const S = {
    tab: "scout",
    agents: {
      scout: { name:"Scout", revoked:false, confirming:false, rules:[
        {eff:"allow", text:"Bid on low and medium frontend issues"},
        {eff:"ask", text:"Anything high severity or touching auth"},
        {eff:"never", text:"Change the database"} ]},
      lens: { name:"Lens", revoked:false, confirming:false, rules:[
        {eff:"allow", text:"Review low-severity frontend fixes"},
        {eff:"ask", text:"Approve anything for merge"} ]}
    },
    decisions: [
      { id:"d1", agent:"lens", issue:"#188", sev:"low", title:"Review the docs typo fix on #188?", meta:"300 pts",
        rule:"Review low-severity docs fixes", start: now, expires: now + 6*3600e3 + 50*60e3 },
      { id:"d2", agent:"scout", issue:"#104", sev:"high", title:"Bid on #104: race condition in event cursors?", meta:"1,200 pts · about 30 min",
        rule:"Bid on high-severity backend issues", start: now, expires: now + 7*3600e3 }
    ],
    done: {},
    activity: [
      {agent:"scout", text:"Bid on #97", chip:["c-allow","Allowed"]},
      {agent:"lens", text:"Reviewed #91", chip:["c-allow","Allowed"]},
      {agent:"scout", text:"Bid on #180", chip:["c-you","You approved"]}
    ]
  };

  const fmt = ms => { const s = Math.max(0, Math.floor(ms/1000)), h = Math.floor(s/3600), m = Math.floor(s%3600/60); return h ? `${h}h ${String(m).padStart(2,"0")}m` : `${m}:${String(s%60).padStart(2,"0")}`; };
  const name = k => S.agents[k].name;
  const bot = (k, size = 30) => `<svg width="${size}" height="${size*1.1}" style="color:${COLOR[k]}; flex:none"><use href="#bot"/></svg>`;
  const ring = d => { const total = d.expires - d.start, left = Math.max(0, d.expires - Date.now()); return 44 * (1 - left / total); };

  function renderQueue(){
    const open = S.decisions.filter(d => !S.done[d.id]).sort((a,b) => a.expires - b.expires);
    const closed = S.decisions.filter(d => S.done[d.id]);
    $("#queue").innerHTML =
      open.map(d => `<article class="card ask-card" data-card="${d.id}">
        <div class="who">${bot(d.agent)}<b>${name(d.agent)}</b> is asking <span class="typing"><i></i><i></i><i></i></span>
          <span class="timer" data-id="${d.id}"><svg viewBox="0 0 18 18"><circle class="tr" cx="9" cy="9" r="7"/><circle class="pr" cx="9" cy="9" r="7" style="stroke-dashoffset:${ring(d)}"/></svg><span>Skips in ${fmt(d.expires - Date.now())}</span></span></div>
        <h3>${d.title}</h3>
        <p class="meta"><span class="sev ${d.sev}">${d.sev}</span>${d.meta}</p>
        <div class="opts">
          <button class="btn primary" data-d="${d.id}" data-o="always">Allow from now on</button>
          <button class="btn" data-d="${d.id}" data-o="once">Just this once</button>
          <button class="btn" data-d="${d.id}" data-o="skip">Skip</button>
        </div></article>`).join("") +
      (open.length ? "" : `<div class="card empty"><svg><use href="#mark"/></svg><b>All caught up</b>Your agents are working within what you've allowed.</div>`) +
      closed.map(d => { const r = S.done[d.id], yes = r !== "skip" && r !== "expired";
        const what = {always:"Allowed from now on", once:"Allowed once", skip:"Skipped", expired:"Skipped, no answer in time"}[r];
        return `<div class="card done"><span class="tick ${yes?"":"n"}">${yes?"✓":"–"}</span><span><b>${d.issue}</b> · ${what}</span>${r==="expired"?"":`<button class="undo" data-undo="${d.id}">Undo</button>`}</div>`; }).join("");
    const nc = $("#navcount"); if (nc.textContent != open.length) { nc.classList.remove("bump"); void nc.offsetWidth; nc.classList.add("bump"); }
    nc.textContent = open.length; nc.hidden = !open.length;
    $("#bubble").textContent = open.length ? open.length : "✓"; $("#bubble").classList.toggle("zero", !open.length);
  }

  function renderRules(fresh){
    const a = S.agents[S.tab];
    $("#rules").className = "card" + (a.revoked ? " revoked" : "");
    $("#rules").innerHTML = `<div class="tabs">${Object.entries(S.agents).map(([k,x]) =>
        `<button class="tab ${S.tab===k?"on":""}" data-tab="${k}">${bot(k, 24)}${x.name}</button>`).join("")}</div>
      <ul class="rules" id="rulelist">${a.rules.map((r,i) => `<li class="${r.eff==="never"?"never":""} ${fresh===i?"fresh":""}"><span class="ri c-${r.eff}" title="${r.eff}"><svg><use href="#i-${r.eff}"/></svg></span><span>${r.text}</span></li>`).join("")}</ul>
      <div class="pfoot">${a.confirming
        ? `<span>Turn off everything ${a.name} can do alone?</span><span style="display:flex;gap:6px"><button class="btn sm danger" id="yes">Revoke</button><button class="btn sm" id="no">Cancel</button></span>`
        : a.revoked ? `<span>${a.name} now asks before everything.</span><button class="btn sm" id="restore">Restore</button>`
        : `<span>Expires in 7 days</span><span class="meter" aria-hidden="true"><i></i></span><button class="btn sm danger" id="revoke">Revoke</button>`}</div>`;
  }

  function renderAct(fresh){
    $("#act").innerHTML = S.activity.map((r,i) => `<li class="${fresh&&i===0?"fresh":""}">${bot(r.agent, 22)}<span>${r.text}</span><span class="chip ${r.chip[0]}">${r.chip[1]}</span></li>`).join("");
  }

  let tt;
  const toast = m => { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 3500); };

  function confetti(x, y, n = 40){
    if (reduce) return;
    const cs = ["#3978f6","#8fc9ff","#2a63d8","#ffffff","#6ee7a8"];
    for (let i = 0; i < n; i++) {
      const p = document.createElement("i"); p.className = "confetti"; p.style.background = cs[i % cs.length];
      if (i % 3 === 0) p.style.borderRadius = "50%";
      document.body.appendChild(p);
      const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 200;
      p.animate([{transform:`translate(${x}px,${y}px)`, opacity:1}, {transform:`translate(${x+Math.cos(a)*v}px,${y+Math.sin(a)*v+160}px) rotate(${Math.random()*720}deg)`, opacity:0}],
        {duration:1000 + Math.random()*700, easing:"cubic-bezier(.2,.7,.4,1)"}).onfinish = () => p.remove();
    }
  }

  function fly(fromEl, text, done){
    const list = $("#rulelist");
    if (reduce || !list) return done();
    const a = fromEl.getBoundingClientRect(), b = list.getBoundingClientRect();
    const f = document.createElement("div"); f.className = "flyer"; f.textContent = "+ " + text; document.body.appendChild(f);
    const dx = b.left + 20 - a.left, dy = b.top + 10 - a.top;
    f.animate([{transform:`translate(${a.left}px,${a.top}px) scale(1)`, opacity:1},
               {transform:`translate(${a.left+dx*.5}px,${a.top+dy*.5-60}px) scale(1.1)`, opacity:1, offset:.5},
               {transform:`translate(${b.left+20}px,${b.top+10}px) scale(.8)`, opacity:0}],
      {duration:750, easing:"cubic-bezier(.5,0,.3,1)"}).onfinish = () => { f.remove(); done(); };
  }

  function decide(id, o, btn){
    const d = S.decisions.find(x => x.id === id), a = S.agents[d.agent];
    const r = btn.getBoundingClientRect();
    if (o !== "skip") confetti(r.left + r.width/2, r.top + r.height/2, o === "always" ? 50 : 24);
    const card = btn.closest(".ask-card");
    const finish = () => {
      S.done[id] = o;
      let fresh;
      if (o === "always") { const i = a.rules.findIndex(x => x.eff !== "allow"); a.rules.splice(i, 0, {eff:"allow", text:d.rule, from:id}); fresh = i; }
      const verb = d.agent === "lens" ? "Reviewed" : "Bid on";
      S.activity.unshift(o === "skip" ? {agent:d.agent, text:`Skipped ${d.issue}`, chip:["c-you","You said no"], from:id}
        : {agent:d.agent, text:`${verb} ${d.issue}`, chip:["c-you","You approved"], from:id});
      renderQueue(); renderRules(fresh); renderAct(true);
      toast(o === "always" ? `${a.name} can do this on its own now.` : o === "skip" ? `${a.name} will skip ${d.issue}.` : `${a.name} can go ahead, just this once.`);
    };
    if (o === "always") {
      if (S.tab !== d.agent) { S.tab = d.agent; renderRules(); }
      fly(btn, d.rule, () => { card.classList.add("leaving"); setTimeout(finish, reduce ? 0 : 300); });
    } else { card.classList.add("leaving"); setTimeout(finish, reduce ? 0 : 380); }
  }

  document.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const a = S.agents[S.tab];
    if (b.dataset.o) { b.closest(".opts").querySelectorAll("button").forEach(x => x.disabled = true); decide(b.dataset.d, b.dataset.o, b); }
    else if (b.dataset.undo) {
      const d = S.decisions.find(x => x.id === b.dataset.undo); delete S.done[d.id];
      Object.values(S.agents).forEach(x => x.rules = x.rules.filter(r => r.from !== d.id));
      S.activity = S.activity.filter(r => r.from !== d.id);
      renderQueue(); renderRules(); renderAct();
    }
    else if (b.dataset.tab) { S.tab = b.dataset.tab; renderRules(); }
    else if (b.id === "revoke") { a.confirming = true; renderRules(); }
    else if (b.id === "no") { a.confirming = false; renderRules(); }
    else if (b.id === "yes") { a.confirming = false; a.revoked = true; renderRules(); }
    else if (b.id === "restore") { a.revoked = false; renderRules(); const r = $("#restore") || $("#revoke"); if (r) { const p = r.getBoundingClientRect(); confetti(p.left, p.top, 20); } }
    else if (b.id === "theme") {
      const r = document.documentElement;
      const cur = r.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      r.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
    }
  });

  setInterval(() => {
    document.querySelectorAll(".timer[data-id]").forEach(el => {
      const d = S.decisions.find(x => x.id === el.dataset.id), left = d.expires - Date.now();
      el.querySelector("span").textContent = "Skips in " + fmt(left);
      el.querySelector(".pr").style.strokeDashoffset = ring(d);
      if (left <= 0 && !S.done[d.id]) {
        S.done[d.id] = "expired";
        S.activity.unshift({agent:d.agent, text:`Skipped ${d.issue}`, chip:["c-ask","No answer"], from:d.id});
        renderQueue(); renderAct(true);
      }
    });
  }, 1000);

  renderQueue(); renderRules(); renderAct();
})();
</script>
</body>
</html>
