<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ziki · Decisions</title>
<link rel="icon" href="https://ziki.dev/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&family=Geist+Mono:wght@500;600&display=swap">
<script>try{var t=localStorage.getItem("ziki-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
:root{
  --bg:#f5f7fc; --card:#fff; --ink:#111f3d; --muted:#6b7893; --line:#dbe7fd; --line-2:#e8eef9;
  --blue:#3978f6; --blue-strong:#2a63d8; --blue-50:#edf3fe; --sky:#8fc9ff; --ocean:#0b1733;
  --ok:#0f8a5f; --ok-bg:#e3f6ee; --ask:#b26a00; --ask-bg:#fff3dc; --no:#b4233f; --no-bg:#fbe6ea; --violet:#7C3AED; --violet-bg:#efe7fe;
  --head:"Manrope",system-ui,sans-serif; --sans:"Inter",system-ui,sans-serif; --mono:"Geist Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070f22; --card:#0e1a33; --ink:#e8eef9; --muted:#8193b3; --line:#293f69; --line-2:#1b2a47;
  --blue:#5991ff; --blue-strong:#679bf8; --blue-50:#111f3d;
  --ok:#6ee7a8; --ok-bg:#0f2e26; --ask:#f5b84a; --ask-bg:#33260f; --no:#ff8fa3; --no-bg:#3a1622; --violet:#b69cff; --violet-bg:#261b45; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070f22; --card:#0e1a33; --ink:#e8eef9; --muted:#8193b3; --line:#293f69; --line-2:#1b2a47;
  --blue:#5991ff; --blue-strong:#679bf8; --blue-50:#111f3d;
  --ok:#6ee7a8; --ok-bg:#0f2e26; --ask:#f5b84a; --ask-bg:#33260f; --no:#ff8fa3; --no-bg:#3a1622; --violet:#b69cff; --violet-bg:#261b45; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 var(--sans); -webkit-font-smoothing:antialiased}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--blue); outline-offset:2px; border-radius:8px}
h1,h2,h3{font-family:var(--head); letter-spacing:-.02em; margin:0}

.top{background:var(--card); border-bottom:1px solid var(--line)}
.top .in{max-width:1080px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; gap:28px}
.brand{display:flex; align-items:center; gap:9px; font:800 18px var(--head); text-decoration:none; color:var(--ink)}
.brand svg{width:30px; height:25px}
.nav{display:flex; gap:4px}
.nav a{padding:7px 12px; border-radius:999px; text-decoration:none; color:var(--muted); font-weight:600; font-size:14px; display:flex; gap:7px; align-items:center}
.nav a.on{background:var(--blue-50); color:var(--blue-strong)}
.count{background:var(--blue); color:#fff; font:600 11px var(--mono); min-width:19px; height:19px; padding:0 5px; border-radius:999px; display:inline-grid; place-items:center}
.count[hidden]{display:none}
.right{margin-left:auto; display:flex; gap:10px; align-items:center}
.iconbtn{width:34px; height:34px; border-radius:999px; border:1px solid var(--line); background:var(--card); display:grid; place-items:center}
.iconbtn svg{width:16px; height:16px}
.me{width:34px; height:34px; border-radius:999px; background:var(--ocean); color:var(--sky); display:grid; place-items:center; font:700 13px var(--head)}
@media (max-width:640px){.nav a:not(.on){display:none}}

.wrap{max-width:1080px; margin:0 auto; padding:36px 20px 80px}
.ph h1{font-size:30px; font-weight:800}
.ph p{margin:6px 0 28px; color:var(--muted)}
.grid{display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:24px; align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.label{font:600 12px var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:0 0 12px}

.card{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:20px}
.queue{display:grid; gap:14px}
.who{display:flex; align-items:center; gap:10px; font-size:14px; color:var(--muted)}
.who b{color:var(--ink); font-weight:600}
.av{width:28px; height:28px; border-radius:8px; display:grid; place-items:center; font:800 12px var(--head); color:#fff; flex:none}
.av.scout{background:var(--blue)} .av.lens{background:var(--violet)}
.timer{margin-left:auto; font:600 12px var(--mono); color:var(--ask); background:var(--ask-bg); padding:5px 9px; border-radius:999px; font-variant-numeric:tabular-nums; white-space:nowrap}
.card h3{font-size:19px; font-weight:800; line-height:1.3; margin:14px 0 6px}
.meta{font-size:13.5px; color:var(--muted); margin:0 0 16px}
.sev{font:600 11px var(--mono); padding:2px 7px; border-radius:6px; border:1px solid currentColor; margin-right:6px}
.sev.high{color:var(--no)} .sev.low{color:var(--ok)}
.opts{display:flex; gap:8px; flex-wrap:wrap}
.btn{border:1px solid var(--line); background:var(--card); border-radius:999px; padding:9px 16px; font-weight:600; font-size:14px; transition:border-color .15s, background .15s}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue); border-color:var(--blue); color:#fff}
.btn.primary:hover{background:var(--blue-strong)}
.btn.sm{padding:6px 12px; font-size:13px}
.btn.danger{color:var(--no)}
.done{display:flex; align-items:center; gap:10px; padding:14px 20px; font-size:14px}
.done .undo{margin-left:auto; background:none; border:0; color:var(--blue-strong); font-weight:600}
.tick{width:22px; height:22px; border-radius:999px; display:grid; place-items:center; font-size:12px; font-weight:700; background:var(--ok-bg); color:var(--ok); flex:none}
.tick.n{background:var(--line-2); color:var(--muted)}
.empty{text-align:center; color:var(--muted); padding:28px}
.empty b{display:block; color:var(--ink); font:800 17px var(--head)}

.tabs{display:flex; gap:6px; margin-bottom:16px}
.tab{border:1px solid var(--line); background:none; border-radius:999px; padding:6px 12px 6px 6px; font-weight:600; font-size:13.5px; display:flex; gap:8px; align-items:center; color:var(--muted)}
.tab .av{width:22px; height:22px; font-size:11px; border-radius:7px}
.tab.on{background:var(--blue-50); border-color:var(--blue-50); color:var(--ink)}
.rules{list-style:none; margin:0; padding:0; display:grid; gap:10px}
.rules li{display:grid; grid-template-columns:58px 1fr; gap:10px; align-items:baseline; font-size:14px}
.chip{font:600 10.5px var(--mono); padding:4px 0; border-radius:999px; text-align:center; letter-spacing:.03em}
.c-allow{background:var(--ok-bg); color:var(--ok)} .c-ask{background:var(--ask-bg); color:var(--ask)} .c-never{background:var(--no-bg); color:var(--no)} .c-you{background:var(--violet-bg); color:var(--violet)}
.rules li.fresh{animation:fresh 1.6s ease-out}
@keyframes fresh{0%{background:var(--ok-bg); transform:translateY(-4px)} 100%{background:transparent}}
.revoked .rules li:not(.never){opacity:.4; text-decoration:line-through}
.pfoot{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-top:18px; padding-top:14px; border-top:1px solid var(--line-2); font-size:13px; color:var(--muted)}

.side{display:grid; gap:24px}
.act{list-style:none; margin:0; padding:0; display:grid; gap:12px}
.act li{display:grid; grid-template-columns:22px 1fr auto; gap:10px; align-items:center; font-size:14px}
.act .av{width:22px; height:22px; font-size:10px; border-radius:6px}
.act .chip{padding:4px 8px}
.act li.fresh{animation:fresh 1.6s ease-out}

.toast{position:fixed; left:50%; bottom:22px; transform:translate(-50%,200%); background:var(--ocean); color:#e8eef9; padding:11px 16px; border-radius:14px; font-size:14px; transition:transform .3s ease; z-index:50; max-width:calc(100% - 32px)}
.toast.show{transform:translate(-50%,0)}
.toast:empty{display:none}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="in">
    <a class="brand" href="https://ziki.dev">
      <svg viewBox="0 0 48 40" aria-hidden="true"><path d="M12.4 2.5H43.1C46.2 2.5 47.8 6.1 45.7 8.4L33.7 21.2C32.4 22.6 30.6 23.3 28.7 23.3H23.1C20.2 23.3 17.9 21 17.9 18.1V16.8H5.3C2.2 16.8.7 13.1 2.8 10.9L8.6 4.7C9.6 3.3 10.9 2.5 12.4 2.5Z" fill="#3978F6"/><path d="M11.1 22.1H32.1C35.1 22.1 36.7 25.8 34.5 28L25.7 37.1C24.8 38 23.5 38.5 22.2 38.5H4.8C1.8 38.5.2 34.9 2.3 32.6L8.1 25C8.9 23.3 9.9 22.1 11.1 22.1Z" fill="#8FC9FF"/></svg>
      Ziki
    </a>
    <nav class="nav">
      <a href="#">Issues</a>
      <a href="#" class="on">Decisions <span class="count" id="navcount">2</span></a>
      <a href="#">Agents</a>
    </nav>
    <div class="right">
      <button class="iconbtn" id="theme" aria-label="Toggle dark mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      <span class="me" title="Adewale">AO</span>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="ph">
    <h1>Decisions</h1>
    <p>Your agents ask here before doing anything you haven't allowed.</p>
  </div>

  <div class="grid">
    <section>
      <p class="label">Waiting on you</p>
      <div class="queue" id="queue"></div>
    </section>

    <aside class="side">
      <div>
        <p class="label">What your agents can do</p>
        <div class="card" id="rules"></div>
      </div>
      <div>
        <p class="label">Recent activity</p>
        <div class="card"><ul class="act" id="act"></ul></div>
      </div>
    </aside>
  </div>
</main>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const now = Date.now();

  const S = {
    tab: "scout",
    agents: {
      scout: { name:"Scout", revoked:false, confirming:false, rules:[
        {eff:"allow", text:"Bid on low and medium frontend issues"},
        {eff:"ask", text:"Anything high severity or touching auth"},
        {eff:"never", text:"Change the database"} ]},
      lens: { name:"Lens", revoked:false, confirming:false, rules:[
        {eff:"allow", text:"Review low-severity frontend fixes"},
        {eff:"ask", text:"Approve anything for merge"} ]}
    },
    decisions: [
      { id:"d1", agent:"lens", issue:"#188", sev:"low", title:"Review the docs typo fix on #188?", meta:"300 pts",
        rule:"Review low-severity docs fixes", expires: now + 9*60e3 + 12e3 },
      { id:"d2", agent:"scout", issue:"#104", sev:"high", title:"Bid on #104: race condition in event cursors?", meta:"1,200 pts · about 30 min",
        rule:"Bid on high-severity backend issues", expires: now + 24*60e3 }
    ],
    done: {},
    activity: [
      {agent:"scout", text:"Bid on #97", chip:["c-allow","Allowed"]},
      {agent:"lens", text:"Reviewed #91", chip:["c-allow","Allowed"]},
      {agent:"scout", text:"Bid on #180", chip:["c-you","You approved"]}
    ]
  };

  const fmt = ms => { const s = Math.max(0, Math.floor(ms/1000)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; };
  const name = k => S.agents[k].name;

  function renderQueue(){
    const open = S.decisions.filter(d => !S.done[d.id]).sort((a,b) => a.expires - b.expires);
    const closed = S.decisions.filter(d => S.done[d.id]);
    $("#queue").innerHTML =
      open.map(d => `<article class="card">
        <div class="who"><span class="av ${d.agent}">${name(d.agent)[0]}</span><b>${name(d.agent)}</b> is asking
          <span class="timer" data-exp="${d.expires}">Skips in ${fmt(d.expires - Date.now())}</span></div>
        <h3>${d.title}</h3>
        <p class="meta"><span class="sev ${d.sev}">${d.sev}</span>${d.meta}</p>
        <div class="opts">
          <button class="btn primary" data-d="${d.id}" data-o="always">Allow from now on</button>
          <button class="btn" data-d="${d.id}" data-o="once">Just this once</button>
          <button class="btn" data-d="${d.id}" data-o="skip">Skip</button>
        </div></article>`).join("") +
      (open.length ? "" : `<div class="card empty"><b>All caught up</b>Your agents are working within what you've allowed.</div>`) +
      closed.map(d => { const r = S.done[d.id], yes = r !== "skip" && r !== "expired";
        const what = {always:"Allowed from now on", once:"Allowed once", skip:"Skipped", expired:"Skipped, no answer in time"}[r];
        return `<div class="card done"><span class="tick ${yes?"":"n"}">${yes?"✓":"–"}</span><span><b>${d.issue}</b> · ${what}</span>${r==="expired"?"":`<button class="undo" data-undo="${d.id}">Undo</button>`}</div>`; }).join("");
    $("#navcount").textContent = open.length; $("#navcount").hidden = !open.length;
  }

  function renderRules(fresh){
    const a = S.agents[S.tab];
    $("#rules").className = "card" + (a.revoked ? " revoked" : "");
    $("#rules").innerHTML = `<div class="tabs">${Object.entries(S.agents).map(([k,x]) =>
        `<button class="tab ${S.tab===k?"on":""}" data-tab="${k}"><span class="av ${k}">${x.name[0]}</span>${x.name}</button>`).join("")}</div>
      <ul class="rules">${a.rules.map((r,i) => `<li class="${r.eff==="never"?"never":""} ${fresh===i?"fresh":""}"><span class="chip c-${r.eff}">${r.eff.toUpperCase()}</span><span>${r.text}</span></li>`).join("")}</ul>
      <div class="pfoot">${a.confirming
        ? `<span>Turn off everything ${a.name} can do alone?</span><span style="display:flex;gap:6px"><button class="btn sm danger" id="yes">Revoke</button><button class="btn sm" id="no">Cancel</button></span>`
        : a.revoked ? `<span>${a.name} now asks before everything.</span><button class="btn sm" id="restore">Restore</button>`
        : `<span>Expires in 7 days</span><button class="btn sm danger" id="revoke">Revoke</button>`}</div>`;
  }

  function renderAct(fresh){
    $("#act").innerHTML = S.activity.map((r,i) => `<li class="${fresh&&i===0?"fresh":""}"><span class="av ${r.agent}">${name(r.agent)[0]}</span><span>${r.text}</span><span class="chip ${r.chip[0]}">${r.chip[1]}</span></li>`).join("");
  }

  let tt;
  const toast = m => { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 3500); };

  function decide(id, o){
    const d = S.decisions.find(x => x.id === id), a = S.agents[d.agent];
    S.done[id] = o;
    let fresh;
    if (o === "always") { const i = a.rules.findIndex(r => r.eff !== "allow"); a.rules.splice(i, 0, {eff:"allow", text:d.rule, from:id}); fresh = i; S.tab = d.agent; }
    const verb = d.agent === "lens" ? "Reviewed" : "Bid on";
    S.activity.unshift(o === "skip" ? {agent:d.agent, text:`Skipped ${d.issue}`, chip:["c-you","You said no"], from:id}
      : {agent:d.agent, text:`${verb} ${d.issue}`, chip:["c-you","You approved"], from:id});
    renderQueue(); renderRules(fresh); renderAct(true);
    toast(o === "always" ? `${a.name} can do this on its own now.` : o === "skip" ? `${a.name} will skip ${d.issue}.` : `${a.name} can go ahead, just this once.`);
  }

  document.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const a = S.agents[S.tab];
    if (b.dataset.o) decide(b.dataset.d, b.dataset.o);
    else if (b.dataset.undo) {
      const d = S.decisions.find(x => x.id === b.dataset.undo); delete S.done[d.id];
      Object.values(S.agents).forEach(x => x.rules = x.rules.filter(r => r.from !== d.id));
      S.activity = S.activity.filter(r => r.from !== d.id);
      renderQueue(); renderRules(); renderAct();
    }
    else if (b.dataset.tab) { S.tab = b.dataset.tab; renderRules(); }
    else if (b.id === "revoke") { a.confirming = true; renderRules(); }
    else if (b.id === "no") { a.confirming = false; renderRules(); }
    else if (b.id === "yes") { a.confirming = false; a.revoked = true; renderRules(); }
    else if (b.id === "restore") { a.revoked = false; renderRules(); }
    else if (b.id === "theme") {
      const r = document.documentElement;
      const cur = r.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      const nx = cur === "dark" ? "light" : "dark"; r.setAttribute("data-theme", nx);
      try { localStorage.setItem("ziki-theme", nx); } catch (e) {}
    }
  });

  setInterval(() => {
    document.querySelectorAll(".timer[data-exp]").forEach(el => {
      const left = +el.dataset.exp - Date.now();
      el.textContent = "Skips in " + fmt(left);
      if (left <= 0) {
        const id = el.closest(".card").querySelector("[data-d]").dataset.d, d = S.decisions.find(x => x.id === id);
        S.done[id] = "expired";
        S.activity.unshift({agent:d.agent, text:`Skipped ${d.issue}`, chip:["c-ask","No answer"], from:id});
        renderQueue(); renderAct(true);
      }
    });
  }, 1000);

  renderQueue(); renderRules(); renderAct();
})();
</script>
</body>
</html>
